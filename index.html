<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DocKnetes: Learn Docker & Kubernetes by Typing</title>
  <meta name="description" content="Learn Docker, Compose, deployment and Kubernetes by typing real commands into a practice terminal. No setup, no long reading. Missions unlock one by one.">
  <meta name="theme-color" content="#f3efe6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='3' y='11' width='58' height='42' rx='5' fill='%23ff5b1a'/><g fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'><circle cx='32' cy='32' r='9.5'/><path d='M32 32V18M32 32l10.9-5.3M32 32l13.6 3.1M32 32l6.1 12.6M32 32l-6.1 12.6M32 32l-13.6 3.1M32 32l-10.9-5.3'/></g><circle cx='32' cy='32' r='3' fill='%23fff'/></svg>">
  <script>
    // Apply saved theme before paint (default: light).
    try { var t = localStorage.getItem("shipit-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="DocKnetes: all modules">
      <!-- A shipping container (Docker) with a helm wheel on its doors (Kubernetes). -->
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="bm-box" x="3" y="11" width="58" height="42" rx="5"/>
        <path class="bm-ribs" d="M11 16v32M17 16v32M47 16v32M53 16v32"/>
        <g class="bm-wheel">
          <circle cx="32" cy="32" r="9.5"/>
          <path d="M32 32V18M32 32l10.9-5.3M32 32l13.6 3.1M32 32l6.1 12.6M32 32l-6.1 12.6M32 32l-13.6 3.1M32 32l-10.9-5.3"/>
          <circle class="bm-hub" cx="32" cy="32" r="3"/>
        </g>
      </svg>
      <!-- The K is mirrored: a container door swung open, hinged between Docker and Kubernetes. -->
      <span class="brand-word" aria-hidden="true">DOC<span class="brand-k">K</span>NETES</span>
    </button>
    <div class="top-progress" title="Missions completed">
      <div class="top-track"><div class="top-fill" id="topFill"></div></div>
      <span id="topCount">0/0</span>
    </div>
    <button class="cases-link" id="casesBtn" type="button"><span aria-hidden="true">🗂️</span> Case files</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <main id="app"></main>

  <script src="sim.js"></script>
  <script src="course.js"></script>
  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
